# /etc/nginx/sites-available/highland  (then: ln -s ../sites-available/highland /etc/nginx/sites-enabled/)
# HTTPS: sudo certbot --nginx -d highland.avunjian.com   (certbot adds the 443 block and the redirect)
server {
    listen 80;
    listen [::]:80;
    server_name highland.avunjian.com;
    root /var/www/highland;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # the game changes often: browsers re-check it on every visit
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/html;
}
